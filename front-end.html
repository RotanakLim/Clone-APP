<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Clone - Front-End Starter</title>
  <style>
    :root {
      --amazon-dark: #131921;
      --amazon-light: #232f3e;
      --amazon-accent: #f3a847;
      --text-light: #ffffff;
      --page-bg: #eaeded;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: #111;
    }

    .top-nav {
      background: var(--amazon-dark);
      color: var(--text-light);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .search-bar {
      flex: 1;
      display: flex;
    }

    .search-bar input {
      flex: 1;
      padding: 8px;
      border: none;
      outline: none;
    }

    .search-bar button {
      border: none;
      background: var(--amazon-accent);
      padding: 8px 12px;
      cursor: pointer;
    }

    .sub-nav {
      background: var(--amazon-light);
      color: var(--text-light);
      padding: 10px 16px;
    }

    .hero {
      background: #d5dbdb;
      padding: 40px 16px;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 20px 16px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      min-height: 160px;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="logo"> <a href="front-end.html">Amazon Clone</a> </div>
      <div class="search-bar">
      <input type="text" placeholder="Search Amazon Clone..." />
      <button>Search</button>
    </div>
    <a href="cart.html">Cart</a>
  </header>

  <nav class="sub-nav">
    <span>Today's Deals</span> ·
    <span>Customer Service</span> ·
    <span>Registry</span> ·
    <span>Gift Cards</span>
  </nav>

  <section class="hero">
    <h1>Welcome to your Amazon Clone starter</h1>
    <p>Start building product lists, auth, and cart features from here.</p>
  </section>

  <main class="products" id="products"></main>

  <script>
    // Basic starter data. Expand this later with API calls.
    const starterProducts = [
      { id: 1, title: "Product 1", price: 19.99 },
      { id: 2, title: "Product 2", price: 29.99 },
      { id: 3, title: "Product 3", price: 39.99 }
    ];

    const productsContainer = document.getElementById("products");

    starterProducts.forEach((product) => {
      const card = document.createElement("article");
      card.className = "product-card";
      card.innerHTML = `
        <h3>${product.title}</h3>
        <p>$${product.price.toFixed(2)}</p>
        <button>Add to Cart</button>
      `;
      productsContainer.appendChild(card);
    });
  </script>
</body>
</html>
